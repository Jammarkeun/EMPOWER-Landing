troke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="539.1176470588235" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="605.5882352941177" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="672.0588235294117" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="738.5294117647059" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="805" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="871.4705882352941" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="595.5882352941177" x2="1050" y2="937.9411764705883" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1124.1176470588234" x2="1050" y2="1034.4117647058822" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1124.1176470588234" x2="1050" y2="1100.8823529411764" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1124.1176470588234" x2="1050" y2="1167.3529411764705" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1124.1176470588234" x2="1050" y2="1233.8235294117646" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1353.5294117647059" x2="1050" y2="1330.2941176470588" stroke="#595959" stroke-width="1.3"/><line x1="1214" y1="1353.5294117647059" x2="1050" y2="1396.764705882353" stroke="#595959" stroke-width="1.3"/><ellipse cx="650" cy="160" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="650" y="157" font-size="16" text-anchor="middle" fill="#1F1F1F">Sign in, change password, read</text><text x="650" y="175" font-size="16" text-anchor="middle" fill="#1F1F1F">notifications</text><text x="650" y="206" font-size="14" font-style="italic" text-anchor="middle" fill="#595959">Used by every signed-in actor: portal users, coordinators, HR officers and administrators</text><ellipse cx="330" cy="291.3636363636364" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="288.3636363636364" font-size="16" text-anchor="middle" fill="#1F1F1F">Register online as an</text><text x="330" y="306.3636363636364" font-size="16" text-anchor="middle" fill="#1F1F1F">applicant</text><ellipse cx="330" cy="394.0909090909091" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="400.0909090909091" font-size="16" text-anchor="middle" fill="#1F1F1F">Recover access to an account</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="66" cy="308.72727272727275" r="11"/><line x1="66" y1="319.72727272727275" x2="66" y2="350.72727272727275"/><line x1="50" y1="330.72727272727275" x2="82" y2="330.72727272727275"/><line x1="66" y1="350.72727272727275" x2="53" y2="372.72727272727275"/><line x1="66" y1="350.72727272727275" x2="79" y2="372.72727272727275"/></g><text x="66" y="394.72727272727275" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Guest (public</text><text x="66" y="412.72727272727275" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">visitor)</text><ellipse cx="330" cy="526.8181818181819" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="523.8181818181819" font-size="16" text-anchor="middle" fill="#1F1F1F">Track own application and</text><text x="330" y="541.8181818181819" font-size="16" text-anchor="middle" fill="#1F1F1F">status</text><ellipse cx="330" cy="629.5454545454546" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="626.5454545454546" font-size="16" text-anchor="middle" fill="#1F1F1F">Send document copies ahead of</text><text x="330" y="644.5454545454546" font-size="16" text-anchor="middle" fill="#1F1F1F">the visit</text><ellipse cx="330" cy="732.2727272727274" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="729.2727272727274" font-size="16" text-anchor="middle" fill="#1F1F1F">Fill in and submit the digital</text><text x="330" y="747.2727272727274" font-size="16" text-anchor="middle" fill="#1F1F1F">Bio-Data</text><ellipse cx="330" cy="835.0000000000001" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="841.0000000000001" font-size="16" text-anchor="middle" fill="#1F1F1F">Confirm training attendance</text><ellipse cx="330" cy="937.7272727272729" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="943.7272727272729" font-size="16" text-anchor="middle" fill="#1F1F1F">Answer a placement offer</text><ellipse cx="330" cy="1040.4545454545455" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="1037.4545454545455" font-size="16" text-anchor="middle" fill="#1F1F1F">Request resignation;</text><text x="330" y="1055.4545454545455" font-size="16" text-anchor="middle" fill="#1F1F1F">acknowledge a notice</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="66" cy="749.6363636363637" r="11"/><line x1="66" y1="760.6363636363637" x2="66" y2="791.6363636363637"/><line x1="50" y1="771.6363636363637" x2="82" y2="771.6363636363637"/><line x1="66" y1="791.6363636363637" x2="53" y2="813.6363636363637"/><line x1="66" y1="791.6363636363637" x2="79" y2="813.6363636363637"/></g><text x="66" y="835.6363636363637" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Applicant /</text><text x="66" y="853.6363636363637" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Employee</text><text x="66" y="871.6363636363637" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">(portal)</text><ellipse cx="330" cy="1173.1818181818182" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="1170.1818181818182" font-size="16" text-anchor="middle" fill="#1F1F1F">Monitor the assigned client's</text><text x="330" y="1188.1818181818182" font-size="16" text-anchor="middle" fill="#1F1F1F">workers</text><ellipse cx="330" cy="1275.909090909091" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="1272.909090909091" font-size="16" text-anchor="middle" fill="#1F1F1F">File violation and incident</text><text x="330" y="1290.909090909091" font-size="16" text-anchor="middle" fill="#1F1F1F">reports</text><ellipse cx="330" cy="1378.6363636363637" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="330" y="1375.6363636363637" font-size="16" text-anchor="middle" fill="#1F1F1F">Send requisitions, schedules</text><text x="330" y="1393.6363636363637" font-size="16" text-anchor="middle" fill="#1F1F1F">and DTR files</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="66" cy="1241.909090909091" r="11"/><line x1="66" y1="1252.909090909091" x2="66" y2="1283.909090909091"/><line x1="50" y1="1263.909090909091" x2="82" y2="1263.909090909091"/><line x1="66" y1="1283.909090909091" x2="53" y2="1305.909090909091"/><line x1="66" y1="1283.909090909091" x2="79" y2="1305.909090909091"/></g><text x="66" y="1327.909090909091" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Coordinator</text><ellipse cx="870" cy="273.2352941176471" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="270.2352941176471" font-size="16" text-anchor="middle" fill="#1F1F1F">Record manpower requests and</text><text x="870" y="288.2352941176471" font-size="16" text-anchor="middle" fill="#1F1F1F">criteria</text><ellipse cx="870" cy="339.7058823529412" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="336.7058823529412" font-size="16" text-anchor="middle" fill="#1F1F1F">Register, screen and verify</text><text x="870" y="354.7058823529412" font-size="16" text-anchor="middle" fill="#1F1F1F">applicants</text><ellipse cx="870" cy="406.1764705882353" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="403.1764705882353" font-size="16" text-anchor="middle" fill="#1F1F1F">Verify documents (folder</text><text x="870" y="421.1764705882353" font-size="16" text-anchor="middle" fill="#1F1F1F">derived)</text><ellipse cx="870" cy="472.6470588235294" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="469.6470588235294" font-size="16" text-anchor="middle" fill="#1F1F1F">Run training: roster,</text><text x="870" y="487.6470588235294" font-size="16" text-anchor="middle" fill="#1F1F1F">attendance, completion</text><ellipse cx="870" cy="539.1176470588235" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="536.1176470588235" font-size="16" text-anchor="middle" fill="#1F1F1F">Run competency evaluation and</text><text x="870" y="554.1176470588235" font-size="16" text-anchor="middle" fill="#1F1F1F">shortlist</text><ellipse cx="870" cy="605.5882352941177" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="602.5882352941177" font-size="16" text-anchor="middle" fill="#1F1F1F">Endorse; record the client's</text><text x="870" y="620.5882352941177" font-size="16" text-anchor="middle" fill="#1F1F1F">decision</text><ellipse cx="870" cy="672.0588235294117" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="669.0588235294117" font-size="16" text-anchor="middle" fill="#1F1F1F">Record deployment and</text><text x="870" y="687.0588235294117" font-size="16" text-anchor="middle" fill="#1F1F1F">reassignment</text><ellipse cx="870" cy="738.5294117647059" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="735.5294117647059" font-size="16" text-anchor="middle" fill="#1F1F1F">Manage schedules, DTR imports</text><text x="870" y="753.5294117647059" font-size="16" text-anchor="middle" fill="#1F1F1F">and reviews</text><ellipse cx="870" cy="805" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="802" font-size="16" text-anchor="middle" fill="#1F1F1F">Review reports, incidents and</text><text x="870" y="820" font-size="16" text-anchor="middle" fill="#1F1F1F">requisitions</text><ellipse cx="870" cy="871.4705882352941" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="868.4705882352941" font-size="16" text-anchor="middle" fill="#1F1F1F">Process resignations; request</text><text x="870" y="886.4705882352941" font-size="16" text-anchor="middle" fill="#1F1F1F">terminations</text><ellipse cx="870" cy="937.9411764705883" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="943.9411764705883" font-size="16" text-anchor="middle" fill="#1F1F1F">Generate and export reports</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="1234" cy="571.5882352941177" r="11"/><line x1="1234" y1="582.5882352941177" x2="1234" y2="613.5882352941177"/><line x1="1218" y1="593.5882352941177" x2="1250" y2="593.5882352941177"/><line x1="1234" y1="613.5882352941177" x2="1221" y2="635.5882352941177"/><line x1="1234" y1="613.5882352941177" x2="1247" y2="635.5882352941177"/></g><text x="1234" y="657.5882352941177" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">HR Officer</text><ellipse cx="870" cy="1034.4117647058822" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1031.4117647058822" font-size="16" text-anchor="middle" fill="#1F1F1F">Manage users, roles and</text><text x="870" y="1049.4117647058822" font-size="16" text-anchor="middle" fill="#1F1F1F">coordinator assignments</text><ellipse cx="870" cy="1100.8823529411764" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1106.8823529411764" font-size="16" text-anchor="middle" fill="#1F1F1F">Decide termination requests</text><ellipse cx="870" cy="1167.3529411764705" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1164.3529411764705" font-size="16" text-anchor="middle" fill="#1F1F1F">Configure settings, criteria</text><text x="870" y="1182.3529411764705" font-size="16" text-anchor="middle" fill="#1F1F1F">and requirement types</text><ellipse cx="870" cy="1233.8235294117646" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1230.8235294117646" font-size="16" text-anchor="middle" fill="#1F1F1F">Review audit trail and sign-in</text><text x="870" y="1248.8235294117646" font-size="16" text-anchor="middle" fill="#1F1F1F">activity</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="1234" cy="1100.1176470588234" r="11"/><line x1="1234" y1="1111.1176470588234" x2="1234" y2="1142.1176470588234"/><line x1="1218" y1="1122.1176470588234" x2="1250" y2="1122.1176470588234"/><line x1="1234" y1="1142.1176470588234" x2="1221" y2="1164.1176470588234"/><line x1="1234" y1="1142.1176470588234" x2="1247" y2="1164.1176470588234"/></g><text x="1234" y="1186.1176470588234" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Administrator</text><ellipse cx="870" cy="1330.2941176470588" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1327.2941176470588" font-size="16" text-anchor="middle" fill="#1F1F1F">Warn of expiring documents</text><text x="870" y="1345.2941176470588" font-size="16" text-anchor="middle" fill="#1F1F1F">(daily)</text><ellipse cx="870" cy="1396.764705882353" rx="180" ry="27" fill="#DEEBF7" stroke="#2F5597" stroke-width="1.5"/><text x="870" y="1393.764705882353" font-size="16" text-anchor="middle" fill="#1F1F1F">Check storage; prune expired</text><text x="870" y="1411.764705882353" font-size="16" text-anchor="middle" fill="#1F1F1F">sign-ins</text><g stroke="#262626" stroke-width="2.2" fill="none"><circle cx="1234" cy="1329.5294117647059" r="11"/><line x1="1234" y1="1340.5294117647059" x2="1234" y2="1371.5294117647059"/><line x1="1218" y1="1351.5294117647059" x2="1250" y2="1351.5294117647059"/><line x1="1234" y1="1371.5294117647059" x2="1221" y2="1393.5294117647059"/><line x1="1234" y1="1371.5294117647059" x2="1247" y2="1393.5294117647059"/></g><text x="1234" y="1415.5294117647059" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">Scheduler</text><text x="1234" y="1433.5294117647059" font-size="16" font-weight="700" text-anchor="middle" fill="#1F1F1F">(system)</text></svg>